name: Bot Shorts Horoscopo (Tu Cielo Hoy)

on:
  schedule:
    # 4 Shorts al día: 8AM, 12PM, 5PM, 9PM CDMX
    # CDMX = UTC-6 (horario estándar) o UTC-5 (horario verano)
    # Usamos UTC para ser consistentes: 14:00, 18:00, 23:00, 03:00 UTC
    - cron: '0 14 * * *'
    - cron: '0 18 * * *'
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  generate-short:
    runs-on: ubuntu-latest

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Bot Shorts
        run: python bt_yt_shorts_clo_hy.py

      - name: Subir logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-error-logs
          path: |
            temp_*.jpg
            temp_*.mp3
