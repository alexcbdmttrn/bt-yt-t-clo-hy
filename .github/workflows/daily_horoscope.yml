name: Bot Horoscopo Master (Tu Cielo Hoy)

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 13 * * 1'
    - cron: '0 17 1 * *'
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Detectar tipo de horoscopo
        id: detectar
        run: |
          DAY_OF_MONTH=$(date -u +%d)
          DAY_OF_WEEK=$(date -u +%u)
          if [ "$DAY_OF_MONTH" = "01" ]; then
            echo "TIPO_HOROSCOPO=monthly" >> $GITHUB_ENV
            echo "Hoy es dia 1: Modo MENSUAL activado"
          elif [ "$DAY_OF_WEEK" = "1" ]; then
            echo "TIPO_HOROSCOPO=weekly" >> $GITHUB_ENV
            echo "Hoy es Lunes: Modo SEMANAL activado"
          else
            echo "TIPO_HOROSCOPO=daily" >> $GITHUB_ENV
            echo "Modo DIARIO activado"
          fi

      - name: Verificar secrets
        run: python -c "import os,sys; keys=['DEEPSEEK_API_KEY','PEXELS_API_KEY','CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_API_TOKEN','YOUTUBE_USER_TOKEN']; missing=[k for k in keys if not os.getenv(k)]; print('Faltan:',missing) if missing else print('Variables listas'); sys.exit(1) if missing else None"

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Bot
        run: python bt_yt_t_clo_hy.py

      - name: Subir logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-error-logs
          path: |
            temp_*.jpg
            temp_*.mp3
