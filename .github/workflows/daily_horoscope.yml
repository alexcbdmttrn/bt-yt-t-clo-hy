name: Bot Horóscopo Diario (Tu Cielo Hoy)

on:
  schedule:
    - cron: '0 10 * * *' # 10:00 AM UTC = 4:00 AM CDMX
  workflow_dispatch: # Permite ejecución manual con un clic

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python con Caché
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Acelera la instalación de librerías

      - name: 🔒 Verificar que existen los Secrets
